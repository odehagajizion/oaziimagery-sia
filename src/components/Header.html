<div style="width: 100%; background: #F4EFE9; border-bottom: 1px solid #E5DED3; font-family: Inter, system-ui, sans-serif; color: #2B2D2F">
<header style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="Website.dc.html" aria-label="OAZI IMAGERY home" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
<dc-import name="Mark" variant="ring" color="#16429B" ink="#2B2D2F" size="44" hint-size="44px,44px"></dc-import>
<span style="display: flex; flex-direction: column; gap: 5px">
<dc-import name="Mark" variant="word" color="#16429B" ink="#2B2D2F" size="22" hint-size="68px,22px"></dc-import>
<span style="font-family: Sora, Inter, sans-serif; font-size: 8px; font-weight: 600; letter-spacing: 0.62em; color: #12367F">IMAGERY</span>
</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 26px; font-size: 15px; font-weight: 500">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<a href="{{item.href}}" aria-current="{{item.current}}" style="color: {{item.color}}; text-decoration: none; padding: 6px 0; border-bottom: 2px solid {{item.line}}">{{item.label}}</a>
</sc-for>

<a href="Contact.dc.html" style="background: #2B2D2F; color: #F4EFE9; text-decoration: none; padding: 12px 20px; border-radius: 999px; font-weight: 600">Start a project</a>

</header>
